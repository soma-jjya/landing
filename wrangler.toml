# 랜딩을 Cloudflare Worker `peakpic-landing` 으로 서비스한다 (2026-11-22, Vercel 프로젝트가 402 DEPLOYMENT_DISABLED 로 꺼져서 옮김).
# 레포 루트의 정적 파일을 그대로 올린다(빌드 없음). 올리지 않을 파일은 .assetsignore.
# 정적 파일 요청은 Worker 코드를 거치지 않는다(무료·무제한). 코드는 PostHog 프록시 /ingest/* 에서만 돈다(cloudflare/worker.js).
name = "peakpic-landing"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-01"
account_id = "94f8aa917eca4f7e634ae0f00f0210c2"

# 공개 주소는 peakpic.app 뿐. workers.dev·미리보기 주소는 끈다(같은 내용이 두 주소에 뜨지 않게).
workers_dev = false
preview_urls = false

# peakpic.app 의 랜딩 경로만 이 Worker 가 받는다. 나머지(/fill, /pair, /f, /privacy, /.well-known …)는 `peakpic-app-site`(peakpic.app/*),
# /admin·/go·/_next 는 `peakpic-admin`. 더 구체적인 패턴이 이기므로 peakpic.app/* 보다 먼저 잡힌다. 쿼리(utm, fbclid)는 매칭에 안 쓰인다.
# 새 최상위 경로를 랜딩에 만들면 여기에 패턴을 추가할 것 (peakpic.app 과 www 둘 다).
routes = [
  { pattern = "peakpic.app/", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "peakpic.app/index.html", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "peakpic.app/couple", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "peakpic.app/couple/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "peakpic.app/fourcut", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "peakpic.app/fourcut/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "peakpic.app/b2b", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "peakpic.app/b2b/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "peakpic.app/css/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "peakpic.app/js/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "peakpic.app/assets/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "peakpic.app/ingest/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "www.peakpic.app/", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "www.peakpic.app/index.html", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "www.peakpic.app/couple", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "www.peakpic.app/couple/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "www.peakpic.app/fourcut", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "www.peakpic.app/fourcut/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "www.peakpic.app/b2b", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "www.peakpic.app/b2b/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "www.peakpic.app/css/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "www.peakpic.app/js/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "www.peakpic.app/assets/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
  { pattern = "www.peakpic.app/ingest/*", zone_id = "fdcc9bcce78714d0c22057db4dbd675e" },
]

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"
run_worker_first = ["/ingest/*"]
